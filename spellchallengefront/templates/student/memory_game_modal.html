{% load static %}
<div class="mg-overlay" id="memoryGameModal" role="dialog" aria-modal="true" aria-labelledby="mgTitle">
  <div class="mg-content">
    <button type="button" class="mg-back" id="mgBackBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Mini Games</span>
    </button>

    <h2 class="mg-title" id="mgTitle">MEMORY GAME</h2>
    <div class="mg-difficulty" id="mgDifficulty">
        <h3>CHOOSE YOUR DIFFICULTY</h3>
        <div class="mg-difficulty-options" id="mgDifficultyOptions"></div>
    </div>

    <div class="mg-timer" id="mgTimer">
      Time: <span id="mgTimerValue">120</span>
    </div>

    <!-- Tablero (las 12 cartas se generan en JS) -->
    <div class="mg-board" id="mgBoard"></div>

    <!-- Pantalla final -->
    <div class="mg-result" id="mgResult">
      <h3 class="mg-result-title">Well done!</h3>
      <p class="mg-result-text">You found all the pairs.</p>
      <div class="mg-result-actions">
        <button type="button" class="mg-btn mg-btn-solid" id="mgPlayAgainBtn">PLAY AGAIN</button>
        <button type="button" class="mg-btn mg-btn-ghost" id="mgExitBtn">BACK TO MINI GAMES</button>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  console.log('Memory Game script loaded');

  'use strict';

  var MG_LOGO = "{% static 'img/spell-challenge_red.png' %}";

  var MG_IMAGES = [];

  function loadMemoryImages() {
    var vocabularyElement =
      document.getElementById('memoryGameVocabulary');

    if (!vocabularyElement) {
      MG_IMAGES = [];
      return;
    }

    var vocabularyData = JSON.parse(
      vocabularyElement.textContent
    );

    MG_IMAGES = vocabularyData
      .filter(function (item) {
        return item.image;
      })
      .map(function (item) {
        return {
          id: item.word,
          alt: item.word,
          src: item.image
        };
      });
  }

  var FLIP_BACK_MS = 900;

  var overlay  = document.getElementById('memoryGameModal');
  var board    = document.getElementById('mgBoard');
  var resultEl = document.getElementById('mgResult');

  var timerEl = document.getElementById('mgTimer');
  var timerValueEl = document.getElementById('mgTimerValue');

  var state = null;
  var preloaded = false;
  var mgFinished = false;

  var MG_DIFFICULTIES = {};

  var MG_GAME_RULES = {
    DI01: {
      pairs: 6,
      time: null
    },
    DI02: {
      pairs: 8,
      time: null
    },
    DI03: {
      pairs: 10,
      time: 120
    }
  };

  function loadMemoryDifficulties() {
    var difficultiesElement = document.getElementById('memoryGameDifficulties');

    if (!difficultiesElement) {
      MG_DIFFICULTIES = {};
      return;
    }

    var difficultiesData = JSON.parse(
      difficultiesElement.textContent
    );

    MG_DIFFICULTIES = {};

    difficultiesData.forEach(function (item) {
      MG_DIFFICULTIES[item.dificultad__clave] = {
        name: item.dificultad__nombre,
        description: item.dificultad__descripcion
      };
    });
  }

  function renderDifficultyOptions() {
      var container = document.getElementById('mgDifficultyOptions');

      container.innerHTML = '';

      Object.keys(MG_DIFFICULTIES).forEach(function (key) {
          var difficulty = MG_DIFFICULTIES[key];

          var button = document.createElement('button');

          button.type = 'button';
          button.className = 'mg-difficulty-btn';
          button.dataset.difficulty = key;

          button.innerText = difficulty.name;

          button.addEventListener('click', function () {
              startGame(key);
          });

          container.appendChild(button);
      });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function preload() {
    if (preloaded) return;
    preloaded = true;
    MG_IMAGES.concat([{ src: MG_LOGO }]).forEach(function (im) {
      var img = new Image();
      img.src = im.src;
    });
  }

  function buildDeck(pairCount) {
    var availableImages = shuffle(MG_IMAGES).slice(0, pairCount);

    var deck = [];

    availableImages.forEach(function (item) {
      
      deck.push({
        pairId: item.id,
        type: 'image',
        word: item.alt,
        src: item.src,
        alt: item.alt
      });

      deck.push({
        pairId: item.id,
        type: 'word',
        word: item.alt,
        src: '',
        alt: item.alt
      });
    });

    return shuffle(deck);
  }

  function makeFace(className, card) {
      var face = document.createElement('span');
      face.className = 'mg-face ' + className;

      if (card.type === 'image') {
          var img = document.createElement('img');

          img.src = card.src;
          img.alt = 'Image of ' + card.word;
          img.draggable = false;

          face.appendChild(img);

      } else if (card.type === 'word') {
          var word = document.createElement('span');

          word.className = 'mg-word';
          word.innerText = card.word;

          face.appendChild(word);

      } else if (card.type === 'logo') {
          var logo = document.createElement('img');

          logo.src = card.src;
          logo.alt = '';
          logo.draggable = false;

          face.appendChild(logo);
      }

      return face;
  }

  function renderBoard(deck) {
      board.innerHTML = '';

      deck.forEach(function (c, idx) {
          var btn = document.createElement('button');

          btn.type = 'button';
          btn.className = 'mg-card';
          btn.dataset.index = idx;
          btn.setAttribute(
              'aria-label',
              'Card ' + (idx + 1)
          );

          var inner = document.createElement('span');
          inner.className = 'mg-card-inner';

          inner.appendChild(
              makeFace('mg-face-front', {
                  type: 'logo',
                  src: MG_LOGO,
                  word: ''
              })
          );

          inner.appendChild(
              makeFace('mg-face-back', c)
          );

          btn.appendChild(inner);
          board.appendChild(btn);
      });
  }

  function clearTimer() {
    if (state && state.timer !== null && state.timer !== undefined) {
      clearInterval(state.timer);
      state.timer = null;
    }
  }

  function startTimer() {
    clearTimer();

    if (!state || state.timeLeft === null) {
      return;
    }

    timerEl.style.display = 'block';
    timerValueEl.innerText = state.timeLeft;

    state.timer = setInterval(function () {
      state.timeLeft--;

      timerValueEl.innerText = state.timeLeft;

      if (state.timeLeft <= 0) {
        clearTimer();
        timeOutGame();
      }
    }, 1000);
  }

  function timeOutGame() {

      if (!state || mgFinished) {
          return;
      }

      mgFinished = true;
      state.lock = true;
      console.log('Memory Game: timeOutGame ejecutada');

      var resultText = 'You ran out of time. Try again!';

      var playAgainBtn = document.getElementById('mgPlayAgainBtn');
      var exitBtn = document.getElementById('mgExitBtn');

      playAgainBtn.disabled = true;
      exitBtn.disabled = true;

      setTimeout(function () {

          board.style.display = 'none';

          document.querySelector('.mg-result-title').innerText =
              'Time is up!';

          document.querySelector('.mg-result-text').innerText =
              resultText + ' Registering experience...';

          resultEl.classList.add('active');

      }, 300);

      miniGames_registerResult(
          'memory_game',
          state.errors,
          false
      )
      .then(function (result) {

          document.querySelector('.mg-result-text').innerText =
              resultText + ' You earned ' + result.xp_earned + ' XP.';

      })
      .catch(function (error) {

          console.error('Memory Game XP error:', error);

          document.querySelector('.mg-result-text').innerText =
              resultText + ' Your experience could not be registered.';

      })
      .finally(function () {

          playAgainBtn.disabled = false;
          exitBtn.disabled = false;

      });
  }


  function startGame(difficultyKey) {
      var rules = MG_GAME_RULES[difficultyKey];

      if (!rules) {
          return;
      }

      clearTimer();
      timerEl.style.display = 'none';

      document.getElementById('mgDifficulty').style.display = 'none';

      loadMemoryImages();

      if (MG_IMAGES.length < rules.pairs) {
          alert(
              'There are not enough words with images available for this difficulty.'
          );

          document.getElementById('mgDifficulty').style.display = 'block';
          return;
      }

      var deck = buildDeck(rules.pairs);

      state = {
          deck: deck,
          first: null,
          lock: false,
          matched: 0,
          pairs: rules.pairs,
          errors: 0,
          difficulty: difficultyKey,
          timeLeft: rules.time,
          timer: null
      };

      mgFinished = false;

      renderBoard(state.deck);

      resultEl.classList.remove('active');
      board.style.display = '';

      timerEl.style.display = 'none';

      if (state.timeLeft !== null) {
        startTimer();
      }
  }

  function onCardClick(e) {
    var btn = e.target.closest('.mg-card');
    if (!btn || !state || state.lock || mgFinished) return;
    if (btn.classList.contains('flipped') || btn.classList.contains('matched')) return;

    btn.classList.add('flipped');

    if (!state.first) {
      state.first = btn;
      return;
    }

    checkMatch(state.first, btn);
  }

  function checkMatch(a, b) {
    var cardA = state.deck[a.dataset.index];
    var cardB = state.deck[b.dataset.index];
    state.first = null;

    if (cardA.pairId === cardB.pairId && cardA.type !== cardB.type) {
      // Par: verde + animación, ya no se pueden seleccionar
      [a, b].forEach(function (c) {
        c.classList.remove('flipped');
        c.classList.add('matched', 'pop');
      });
      state.matched++;

      console.log(
          'Memory Game: pairs matched',
          state.matched,
          '/',
          state.pairs
      );

      if (state.matched === state.pairs) {
          console.log('Memory Game: calling finishGame');
          finishGame();
      }
    }

    // No es par: se muestran un momento y se regresan
    state.lock = true;
    state.errors++;
    console.log('Memory Game: error registrado', state.errors);

    setTimeout(function () {
      [a, b].forEach(function (c) { c.classList.add('wrong'); });
    }, 350);
    setTimeout(function () {
      [a, b].forEach(function (c) { c.classList.remove('flipped', 'wrong'); });
      state.lock = false;
    }, FLIP_BACK_MS + 350);
  }
    
  function finishGame() {

      if (!state || mgFinished) {
          return;
      }
      console.log(
          'Memory Game XP function:',
          typeof miniGames_registerResult
      );

      console.log(
          'Memory Game XP tokens:',
          typeof miniGameRoundTokens,
          miniGameRoundTokens
      );

      mgFinished = true;
      state.lock = true;

      console.log('Memory Game: finishGame ejecutada');

      clearTimer();

      var resultText = 'You found all the pairs.';

      var playAgainBtn = document.getElementById('mgPlayAgainBtn');
      var exitBtn = document.getElementById('mgExitBtn');

      playAgainBtn.disabled = true;
      exitBtn.disabled = true;

      setTimeout(function () {

          board.style.display = 'none';

          document.querySelector('.mg-result-title').innerText =
              'Well done!';

          document.querySelector('.mg-result-text').innerText =
              resultText + ' Registering experience...';

          resultEl.classList.add('active');

      }, 1200);

      miniGames_registerResult(
          'memory_game',
          state.errors,
          true
      )
      .then(function (result) {

          document.querySelector('.mg-result-text').innerText =
              resultText + ' You earned ' + result.xp_earned + ' XP!';

      })
      .catch(function (error) {

          console.error('Memory Game XP error:', error);

          document.querySelector('.mg-result-text').innerText =
              resultText + ' Your experience could not be registered.';

      })
      .finally(function () {

          playAgainBtn.disabled = false;
          exitBtn.disabled = false;

      });
  }


  /* ---------- Abrir / cerrar ---------- */
  function openMemoryGame() {
    loadMemoryImages();
    loadMemoryDifficulties();
    preload();

    board.style.display = 'none';
    resultEl.classList.remove('active');

    renderDifficultyOptions();

    document.getElementById('mgDifficulty').style.display = 'block';

    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeMemoryGame() {
    clearTimer();

    timerEl.style.display = 'none';
    
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  window.openMemoryGame = openMemoryGame;
  window.closeMemoryGame = closeMemoryGame;

  /* ---------- Eventos ---------- */
  board.addEventListener('click', onCardClick);
  document.getElementById('mgBackBtn').addEventListener('click', closeMemoryGame);
  document.getElementById('mgExitBtn').addEventListener('click', closeMemoryGame);
  document.getElementById('mgPlayAgainBtn').addEventListener('click', function () {
    startGame(state.difficulty);
  });

  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeMemoryGame();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('active')) closeMemoryGame();
  });

  // Cualquier elemento de mini_games.html con este atributo abre el modal
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-open-memory-game]')) {
      e.preventDefault();
      openMemoryGame();
    }
  });
})();
</script>
