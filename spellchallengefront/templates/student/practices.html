{% extends 'student/student_base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/student_base.css' %}"> {# o teacher_base.css #}
<link rel="stylesheet" href="{% static 'css/practice.css' %}">
{% endblock %}

{% block student_content %}

<div class="practice-header">
  <span class="unit-badge">Unit #1: Beginning (A1)</span>
  <div class="practice-header-icons">
    <i data-lucide="bar-chart-2"></i>
    <i data-lucide="bell" class="notification-bell"></i>
  </div>
</div>

<div class="practice-path-wrapper">

  <div class="practice-label">
    <p class="practice-label-title">Practice #1</p>
    <p class="practice-label-subtitle">Greetings</p>
  </div>

  <div class="practice-path">

    <div class="path-node-wrap node-low">
      <button class="path-node node-star" data-bs-toggle="modal" data-bs-target="#practiceModal">
        <svg viewBox="0 0 24 24" class="star-icon"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 16.9 5.8 20.3l1.6-6.8L2.2 8.9l6.9-.6L12 2z"/></svg>
      </button>
    </div>

    <div class="path-connector connector-active"></div>

    <div class="path-node-wrap node-high">
      <button class="path-node node-locked" disabled>
        <i data-lucide="lock"></i>
      </button>
    </div>

    <div class="path-connector"></div>

    <div class="path-node-wrap node-low">
      <button class="path-node node-locked" disabled>
        <i data-lucide="lock"></i>
      </button>
    </div>

    <div class="path-connector"></div>

    <div class="path-node-wrap node-high">
      <button class="path-node node-locked" disabled>
        <i data-lucide="lock"></i>
      </button>
    </div>

    <div class="path-connector"></div>

    <div class="path-node-wrap node-low">
      <button class="path-node node-locked" disabled>
        <i data-lucide="lock"></i>
      </button>
    </div>

    <div class="path-connector"></div>

    <div class="path-node-wrap node-high">
      <button class="path-node node-locked" disabled>
        <i data-lucide="lock"></i>
      </button>
    </div>

    <div class="path-connector"></div>

    <div class="path-node-wrap node-low">
      <button class="path-node node-locked" disabled>
        <i data-lucide="lock"></i>
      </button>
    </div>

    <div class="path-connector"></div>

    <div class="path-node-wrap node-high">
      <button class="path-node node-locked" disabled>
        <i data-lucide="lock"></i>
      </button>
    </div>

  </div>

  <button class="next-unit-btn">
    <i data-lucide="arrow-right"></i>
  </button>

</div>

<div class="modal fade" id="practiceModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content practice-modal">

      <div class="modal-header practice-modal-header">
        <h5 class="modal-title">PRACTICE #1 - GREETINGS</h5>
        <span class="practice-percent">0%</span>
        <button type="button" class="btn-close practice-modal-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body practice-modal-body">
        <div class="lesson-row">
          <span class="lesson-label">LESSON 1</span>
          <a href="#" class="lesson-play-btn">PLAY</a>
        </div>
        <div class="lesson-row">
          <span class="lesson-label lesson-label-locked">LESSON 2</span>
          <button class="lesson-locked-btn" disabled>LOCKED</button>
        </div>
        <div class="lesson-row">
          <span class="lesson-label lesson-label-locked">LESSON 3</span>
          <button class="lesson-locked-btn" disabled>LOCKED</button>
        </div>
        <div class="lesson-row">
          <span class="lesson-label lesson-label-locked">LESSON 4</span>
          <button class="lesson-locked-btn" disabled>LOCKED</button>
        </div>
      </div>

    </div>
  </div>
</div>

{% endblock student_content %}
