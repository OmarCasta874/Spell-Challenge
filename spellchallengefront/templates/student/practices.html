{% extends 'student/student_base.html' %}

{% block student_content %}
<div class="mb-4">
  <span class="badge bg-secondary mb-1">Unit #1: Beginning (A1)</span>
  <h3>Practice #1: Greetings</h3>
</div>

<div class="card p-5 shadow-sm align-items-center justify-content-center bg-white" style="min-height: 300px;">
  <div class="d-flex align-items-center gap-4 flex-wrap justify-content-center">
    
    <button class="btn btn-danger rounded-circle p-3 shadow" style="width: 70px; height: 70px;" data-bs-toggle="modal" data-bs-target="#practiceModal">
      <i class="bi bi-star-fill fs-3 text-white">★</i>
    </button>
    
    <div class="border-top border-4 border-danger" style="width: 40px;"></div>

    <button class="btn btn-light border rounded-circle p-3" style="width: 60px; height: 60px;" disabled>🔒</button>
    <div class="border-top border-3 border-secondary" style="width: 30px;"></div>

    <button class="btn btn-light border rounded-circle p-3" style="width: 60px; height: 60px;" disabled>🔒</button>
    <div class="border-top border-3 border-secondary" style="width: 30px;"></div>

    <button class="btn btn-light border rounded-circle p-3" style="width: 60px; height: 60px;" disabled>🔒</button>
  </div>
</div>

<div class="modal fade" id="practiceModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white p-3">
      
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">PRACTICE #1 - GREETINGS</h5>
        <span class="badge bg-danger ms-auto fs-6">0%</span>
        <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="d-flex justify-content-between align-items-center bg-secondary bg-opacity-25 p-3 rounded mb-2">
          <span class="fw-bold">LESSON 1</span>
          <a href="#" class="btn btn-danger btn-sm px-4 fw-bold">PLAY</a>
        </div>
        <div class="d-flex justify-content-between align-items-center bg-secondary bg-opacity-10 p-3 rounded mb-2">
          <span class="text-muted">LESSON 2</span>
          <button class="btn btn-outline-light btn-sm px-3" disabled>LOCKED</button>
        </div>
        <div class="d-flex justify-content-between align-items-center bg-secondary bg-opacity-10 p-3 rounded mb-2">
          <span class="text-muted">LESSON 3</span>
          <button class="btn btn-outline-light btn-sm px-3" disabled>LOCKED</button>
        </div>
        <div class="d-flex justify-content-between align-items-center bg-secondary bg-opacity-10 p-3 rounded">
          <span class="text-muted">LESSON 4</span>
          <button class="btn btn-outline-light btn-sm px-3" disabled>LOCKED</button>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock student_content %}
