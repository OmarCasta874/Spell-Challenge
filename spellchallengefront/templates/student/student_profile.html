{% extends 'student/student_base.html' %}
{% load static %}

{% block extra_css %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'css/student_profile.css' %}">
{% endblock %}

{% block content %}
<div class="profile-container">
  <!-- Cabecera / Banner con Avatar y Nombre -->
  <div class="profile-header">
    <div class="avatar-wrapper">
      <img src="{% static 'images/student_avatar.png' %}" alt="Avatar del estudiante" class="profile-avatar">
    </div>
    <div class="user-main-info">
      <h1 class="user-fullname">{{ request.user.get_full_name|default:"JESÚS OMAR CASTAÑON CASTAÑON" }}</h1>
      <p class="user-subtitle">20 YEARS • English Student</p>
    </div>
  </div>

  <!-- Formulario / Datos de la cuenta -->
  <div class="account-settings-card">
    <h2 class="section-title">ACCOUNT SETTINGS</h2>
    
    <form method="POST" action="{% url 'edit_profile' %}" class="profile-form">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-group">
          <label for="first_name">First Name:</label>
          <input type="text" id="first_name" name="first_name" value="{{ request.user.first_name|default:'Jesús Omar' }}" class="form-control">
        </div>

        <div class="form-group">
          <label for="last_name">Last Name:</label>
          <input type="text" id="last_name" name="last_name" value="{{ request.user.last_name|default:'Castañon Castañon' }}" class="form-control">
        </div>

        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" value="{{ request.user.email|default:'jesus.omar@spell-challenge.usa' }}" class="form-control">
        </div>

        <div class="form-group">
          <label for="role">Role:</label>
          <input type="text" id="role" name="role" value="Student" class="form-control" readonly>
        </div>
      </div>

      <!-- Acciones principales -->
      <div class="profile-actions">
        <button type="submit" class="btn btn-edit">Edit Profile</button>
        <button type="button" class="btn btn-logout" data-bs-toggle="modal" data-bs-target="#logoutModal">Log Out</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
