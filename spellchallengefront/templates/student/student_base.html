{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<div class="d-flex vh-100">
    <aside class="bg-dark text-white p-3 style=width: 260px;">
    <h3 class="fw-bold mb-4">SPELL-CHALLENGE</h3>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="{% url 'student_home' %}" class="nav-link text-white {% if request.resolver_match.url_name == 'student_home' %}active{% endif %}">
          HOME
        </a>
      </li>
      <li>
        <a href="{% url 'student_groups' %}" class="nav-link text-white {% if request.resolver_match.url_name == 'student_groups' %}active{% endif %}">
          MY GROUPS
        </a>
      </li>
      <li>
        <a href="{% url 'practices' %}" class="nav-link text-white {% if request.resolver_match.url_name == 'practices' %}active{% endif %}">
          PRACTICE
        </a>
      </li>
      <li><a href="#" class="nav-link text-secondary">COMPETITIONS</a></li>
      <li><a href="#" class="nav-link text-secondary">STATISTICS</a></li>
      <li><a href="#" class="nav-link text-secondary">PROFILE</a></li>
    </ul>
  </aside>

  <main class="flex-grow-1 p-4 bg-light overflow-auto">
    {% block teacher_content %}{% endblock %}
  </main>
</div>
{% endblock %}
