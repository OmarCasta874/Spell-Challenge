{% load static %}
<div class="modal fade" id="saveChangesModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content save-changes-content">

      <div class="save-changes-avatar-wrap" style="width: 100px; height: 100px; margin: 20px auto 0 auto; border-radius: 50%; border: 4px solid #7A1F2B; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.2); background-color: #ffffff;">
        {% if request.user.alumno.foto %}
          <img src="{{ request.user.alumno.foto.url }}" alt="Avatar" class="save-changes-avatar" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        {% elif request.user.profesor.foto %}
          <img src="{{ request.user.profesor.foto.url }}" alt="Avatar" class="save-changes-avatar" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        {% else %}
          <img src="{% static avatar_img %}" alt="Avatar" class="save-changes-avatar" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        {% endif %}
      </div>

      <div class="modal-body save-changes-body">
        <h3 class="save-changes-title" style="margin-top: 25px !important;">Save Changes</h3>
        <p class="save-changes-text">Are you sure you want to save changes?. All applied changes will be saved.</p>

        <div class="save-changes-actions">
          <button type="button" class="btn-save-no" data-bs-dismiss="modal">NO</button>
          <button type="submit" form="{{ form_id }}" class="btn-save-yes">YES</button>
        </div>
      </div>

    </div>
  </div>
</div>
