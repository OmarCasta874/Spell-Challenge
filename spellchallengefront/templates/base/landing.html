{% extends 'base/base.html' %}
{% load static %}
{% block title %}Spell-Challenge — Learn, Practice, Challenge, Spell{% endblock %}

{% block content %}
<div class="landing">

    <div class="topbar">
      <a href="{% url 'login' %}" class="btn btn-outline">Login</a>
      <a href="{% url 'choose_role' %}" class="btn btn-primary">Sign Up</a>
    </div>

  <div class="landing__hero">
    <div class="landing__hero-row">
      <img class="mascot" src="{% static 'img/bee.png' %}" alt="" aria-hidden="true">

      <div class="brand-lockup">
        <div class="brand-mark">
          <img src="{% static 'img/logo.png' %}" alt="Spell-Challenge logo">
        </div>
      </div>

      <img class="mascot" src="{% static 'img/bee.png' %}" alt="" aria-hidden="true">
    </div>

    <div class="landing__heading">
      <h1>Welcome to <strong>SPELL-CHALLENGE</strong></h1>
      <p>Learn, Practice, Challenge, Spell</p>
    </div>
  </div>

  <div class="landing__corner-mascots">
    <img class="mascot" src="{% static 'img/crow.png' %}" alt="" aria-hidden="true">
    <img class="mascot" src="{% static 'img/crow.png' %}" alt="" aria-hidden="true">
  </div>

</div>
{% endblock %}
