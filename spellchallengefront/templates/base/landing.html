{% extends 'base/base.html' %}
{% load static %}
{% block title %}Spell-Challenge — Learn, Practice, Challenge, Spell{% endblock %}
{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}
{% block content %}
<div class="landing">

  <div class="landing__hero">
    <h1 class="landing__welcome">Welcome to</h1>

    <div class="brand-lockup">
      <div class="brand-mark">
        <img src="{% static 'img/spell-challenge_red.png' %}" alt="Spell-Challenge logo">
      </div>
    </div>

    <p class="landing__tagline">Learn, Practice, Challenge, Spell</p>

    <div class="landing__cta">
      <a href="{% url 'login' %}" class="btn btn-outline">Login</a>
      <a href="{% url 'choose_role' %}" class="btn btn-primary">Sign Up</a>
    </div>
  </div>

</div>
{% endblock %}
