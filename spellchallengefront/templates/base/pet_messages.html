{% load static %}
<div id="mascot-widget"
     class="mascot mascot--{{ mascot }}"
     data-title="{{ mascot_msg.title|default:'' }}"
     data-text="{{ mascot_msg.text|default:'' }}">
  <div class="mascot-bubble" role="status" aria-live="polite" hidden>
    <button type="button" class="mascot-close" aria-label="Close message">
      <svg viewBox="0 0 24 24" width="22" height="22"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" aria-hidden="true">
        <path d="M5 5l14 14M19 5L5 19"/>
      </svg>
    </button>
    <div class="mascot-message-header">
      <span class="mascot-message-icon" aria-hidden="true">
        {% if mascot == "beenary" %}🐝{% else %}🐦{% endif %}
      </span>
      <span class="mascot-message-name">
        {% if mascot == "beenary" %}
          Beenary says:
        {% else %}
          Crowing says:
        {% endif %}
      </span>
    </div>
    <div class="mascot-message-content">
      <p class="mascot-title"></p>
      <p class="mascot-text"></p>
    </div>
  </div>
  <img class="mascot-img"
       src="{% static 'img/'|add:mascot_img %}"
       alt="{{ mascot|capfirst }}"
       width="100">
</div>
