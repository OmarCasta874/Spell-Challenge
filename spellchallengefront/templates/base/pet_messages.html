{% load static %}
<div id="mascot-widget"
     class="mascot mascot--{{ mascot }}"
     data-title="{{ mascot_msg.title|default:'' }}"
     data-text="{{ mascot_msg.text|default:'' }}">
  <div class="mascot-bubble" role="status" aria-live="polite" hidden>
    <button type="button" class="mascot-close" aria-label="Close message">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M5 5l14 14M19 5L5 19"/>
      </svg>
    </button>
    <p class="mascot-title"></p>
    <p class="mascot-text"></p>
  </div>
  <img class="mascot-img" src="{% static 'img/'|add:mascot_img %}" alt="{{ mascot|capfirst }}" width="100">
</div>
