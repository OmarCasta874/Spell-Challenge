{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spell-Challenge{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/beenary-left.png' %}">

    <!-- Aplica el tema guardado ANTES de renderizar para evitar destellos blancos -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('spell_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- CSS de Bootstrap, antes de extra_css para que tus estilos personalizados puedan sobreescribirlo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- JS de Bootstrap, antes de main.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_css %}{% endblock %}
    <!-- Variables y reglas globales de Modo Oscuro al final para tener prioridad -->
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">

  {% block content %}{% endblock %}

  {% block extra_modals %}{% endblock %}

  <!-- Botón global de Modo Oscuro / Claro -->
  <button type="button" id="themeToggleBtn" class="theme-toggle-fab" aria-label="Toggle dark mode" title="Switch theme">
    <i data-lucide="moon" id="themeIconMoon"></i>
    <i data-lucide="sun" id="themeIconSun" style="display: none;"></i>
  </button>

  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/pet_messages.js' %}"></script>
  <script src="{% static 'js/pet_feedback.js' %}"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    (function() {
      const btn = document.getElementById('themeToggleBtn');
      const moonIcon = document.getElementById('themeIconMoon');
      const sunIcon = document.getElementById('themeIconSun');
      if (!btn) return;

      let isFixing = false;
      let fixTimer = null;

      function syncThemeUI(theme) {
        const isDark = theme === 'dark';
        if (moonIcon) moonIcon.style.display = isDark ? 'none' : 'block';
        if (sunIcon) sunIcon.style.display = isDark ? 'block' : 'none';
      }

      function isLightColor(rgbStr) {
        const match = rgbStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
        if (!match) return false;
        const alpha = match[4] !== undefined ? parseFloat(match[4]) : 1;
        if (alpha === 0) return false;
        const r = parseInt(match[1], 10);
        const g = parseInt(match[2], 10);
        const b = parseInt(match[3], 10);
        return r > 225 && g > 225 && b > 225;
      }

      function saveOrigStyle(el) {
        if (!el || el.dataset.origStyleSaved === '1') return;
        const rawStyle = el.getAttribute('style') || '';
        // Nunca guardar display/visibility/opacity para no cerrar modales abiertos al volver a modo claro
        const safeStyle = rawStyle
          .split(';')
          .map(s => s.trim())
          .filter(s => s && !/^(display|visibility|opacity|pointer-events)\s*:/i.test(s))
          .join('; ');
        el.dataset.origStyle = safeStyle;
        el.dataset.origStyleSaved = '1';
      }

      function isInsideMiniGame(el) {
        if (el.closest('[data-memory-modal="1"], [data-memory-backdrop="1"], [data-minigame-modal="1"], [class*="memory"], [id*="memory"], [class*="minigame"], [id*="minigame"], [class*="hangman"], [id*="hangman"], [class*="missing"], [id*="missing"], [class*="wordsearch"], [id*="wordsearch"]')) {
          return true;
        }
        let parent = el.parentElement;
        while (parent && parent !== document.body && parent.tagName !== 'MAIN') {
          const txt = parent.textContent || '';
          if (!txt.includes('HANGMAN') && (txt.includes('MEMORY GAME') || txt.includes('MISSING LETTERS') || txt.includes('WORD SEARCH'))) {
            return true;
          }
          parent = parent.parentElement;
        }
        return false;
      }

      function isInsideBossBattle(el) {
        if (el.closest('[data-boss-modal="1"], [class*="boss"], [id*="boss"]')) {
          return true;
        }
        const container = el.closest('[class*="modal"], [class*="dialog"], section, div');
        if (container && container.offsetWidth > 0 && container.offsetWidth <= window.innerWidth * 0.95) {
          const txt = container.textContent || '';
          if (txt.includes('BOSS BATTLE') && (txt.includes('KING BEE') || txt.includes('EXIT BATTLE') || txt.includes('GUESS THE WORD'))) {
            return true;
          }
        }
        return false;
      }

      function fixRemainingLightSurfaces() {
        if (isFixing) return;
        isFixing = true;

        try {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

          if (!isDark) {
            document.querySelectorAll('[data-injected-close="1"]').forEach(el => el.remove());
            document.querySelectorAll('[data-orig-style-saved="1"], [data-dark-fixed]').forEach(el => {
              const currentDisplay = el.style.display;
              const currentVisibility = el.style.visibility;
              const currentOpacity = el.style.opacity;

              if (el.dataset.origStyle) {
                el.setAttribute('style', el.dataset.origStyle);
              } else {
                el.removeAttribute('style');
              }

              // Preservar si el modal o dropdown estaba abierto al cambiar de tema
              if (currentDisplay) el.style.display = currentDisplay;
              if (currentVisibility) el.style.visibility = currentVisibility;
              if (currentOpacity) el.style.opacity = currentOpacity;

              delete el.dataset.origStyle;
              delete el.dataset.origStyleSaved;
              delete el.dataset.darkFixed;
              delete el.dataset.breakCard;
              delete el.dataset.breakTimer;
              delete el.dataset.homeStat;
              delete el.dataset.notifModal;
              delete el.dataset.notifItem;
              delete el.dataset.notifUnread;
              delete el.dataset.notifIcon;
              delete el.dataset.bossModal;
              delete el.dataset.bossRound;
              delete el.dataset.bossIntro;
              delete el.dataset.bossArena;
              delete el.dataset.bossHpLabel;
              delete el.dataset.bossHpTrack;
              delete el.dataset.bossHpFill;
              delete el.dataset.bossClue;
              delete el.dataset.bossOption;
              delete el.dataset.memoryModal;
              delete el.dataset.memoryBackdrop;
              delete el.dataset.memoryBoard;
              delete el.dataset.modalBackdrop;
              delete el.dataset.modalWrapper;
              delete el.dataset.genericModal;
              delete el.dataset.profileConfirmModal;
              delete el.dataset.modalAvatar;
              delete el.dataset.minigameModal;
              delete el.dataset.modalSubcard;
              delete el.dataset.viewCompBtn;
              delete el.dataset.modalCloseBtn;
              delete el.dataset.dashTrack;
              delete el.dataset.dashFill;
              delete el.dataset.dashDot;
              delete el.dataset.dashSegment;
              delete el.dataset.cefrLevel;
              delete el.dataset.wordlistOption;
              delete el.dataset.tableViewBtn;
              delete el.dataset.compActions;
              delete el.dataset.compManageBtn;
              delete el.dataset.burgundyText;
              delete el.dataset.burgundyPrimary;
              delete el.dataset.mutedLight;
              delete el.dataset.teacherProfileCard;
              delete el.dataset.compStatus;
              delete el.dataset.cropModal;
              delete el.dataset.cropArea;
              delete el.dataset.darkAlert;
              delete el.dataset.darkAlertWrapper;
              delete el.dataset.adminPie;
              delete el.dataset.adminLegend;
              delete el.dataset.adminLevelBox;
              delete el.dataset.adminBarTrack;
              delete el.dataset.adminBarFill;
              delete el.dataset.adminWordRow;
              delete el.dataset.adminAvgPill;
              delete el.dataset.adminLegendPseudo;
              delete el.dataset.adminTeacherTable;
              delete el.dataset.adminStatusPill;
              delete el.dataset.adminGroupBadge;
              delete el.dataset.adminRolePill;
              delete el.dataset.adminLevelPill;
              delete el.dataset.adminAcademyCard;
              delete el.dataset.adminCardGridWrap;
              delete el.dataset.adminAcademyTab;
              delete el.dataset.adminBackupCard;
              delete el.dataset.adminBackupTypePill;
              delete el.dataset.compControlCard;
              delete el.dataset.compRoundBadge;
              delete el.dataset.compRoundActionBtn;
              delete el.dataset.compHexTile;
              delete el.dataset.wordlistMetaPill;
              delete el.dataset.importExcelModal;
              delete el.dataset.importDropzone;
              delete el.dataset.importChooseBtn;
              delete el.dataset.importNoticeBox;
              delete el.dataset.importCloseBtn;
              delete el.dataset.importCancelBtn;
              delete el.dataset.importSubmitBtn;
              delete el.dataset.importInnerWrapper;
              delete el.dataset.wordListOuterWrapper;
              delete el.dataset.mediaStatusPill;
              delete el.dataset.mediaLevelPill;
              delete el.dataset.mediaBtnWrapper;
              delete el.dataset.mediaUploadBtn;
              delete el.dataset.importPreviewPill;
              delete el.dataset.importStatusCell;
              delete el.dataset.statsChartBar;

              if (el.matches('main button, main a') && /^(CAREERS|GROUPS|LEVELS)$/i.test((el.textContent || '').trim())) {
                el.style.removeProperty('background');
                el.style.removeProperty('background-color');
                el.style.removeProperty('color');
                el.style.removeProperty('border');
              }
            });
            return;
          }

          const petYellowBgs = [
            'rgb(254, 249, 195)',
            'rgb(255, 251, 235)',
            'rgb(254, 243, 199)',
            'rgb(255, 248, 220)',
            'rgb(253, 246, 178)'
          ];

          document.querySelectorAll('div, section, article, aside, header, p, span, h1, h2, h3, h4, h5, h6, strong, label, td, th, a, button').forEach(el => {
            if (
              el.closest('.navbar, header.navbar, #theme-toggle, .theme-toggle, [data-theme-toggle], [data-theme-fab="1"], .creator-card, [data-profile-confirm-modal="1"], [data-dash-track="1"], [data-wordlist-option="1"], [data-table-view-btn="1"], [data-home-stat="1"], [data-comp-actions="1"], [data-comp-manage-btn="1"], [data-teacher-profile-card="1"], [data-comp-status], [data-crop-modal="1"], [data-dark-alert], [data-admin-pie="1"], [data-admin-legend], [data-admin-legend-pseudo], [data-admin-level-box="1"], [data-admin-bar-track="1"], [data-admin-word-row="1"], [data-admin-avg-pill="1"], [data-admin-status-pill], [data-admin-group-badge="1"], [data-admin-role-pill], [data-admin-level-pill="1"], [data-admin-academy-card="1"], [data-admin-card-grid-wrap="1"], [data-admin-academy-tab], [data-admin-backup-card="1"], [data-admin-backup-type-pill], [data-comp-control-card="1"], [data-comp-round-badge="1"], [data-comp-round-action-btn="1"], [data-comp-hex-tile="1"], [data-wordlist-meta-pill="1"], [data-import-excel-modal="1"]') ||
              (el.matches('main button, main a') && /^(CAREERS|GROUPS|LEVELS)$/i.test((el.textContent || '').trim())) ||
              el.dataset.dashFill === '1' ||
              el.dataset.adminBarFill === '1' ||
              isInsideMiniGame(el) ||
              isInsideBossBattle(el) ||
              el.classList.contains('toggle-password') ||
              el.classList.contains('btn-close') ||
              el.dataset.injectedClose === '1' ||
              el.id === 'themeToggleBtn'
            ) return;

            const styles = getComputedStyle(el);
            const bg = styles.backgroundColor;
            const isFullScreen = el.offsetWidth >= window.innerWidth * 0.9 && el.offsetHeight >= window.innerHeight * 0.85;
            const isModalWrapper = el.classList.contains('modal') || el.classList.contains('modal-dialog');
            const isModalSurface = !isFullScreen && !isModalWrapper && (el.classList.contains('modal-content') || el.classList.contains('modal-header') || el.classList.contains('modal-body') || el.classList.contains('modal-footer') || el.getAttribute('role') === 'dialog' || el.tagName === 'DIALOG');
            const rawParentCard = el.parentElement ? el.parentElement.closest('.card, [class*="-card"], [class*="category"], [class*="skill"], [class*="mode"], .auth-card, .modal-content') : null;
            const parentCard = (rawParentCard && (rawParentCard.offsetWidth === 0 || rawParentCard.offsetWidth < window.innerWidth * 0.72)) ? rawParentCard : null;
            const isBadgeOrAction = el.tagName === 'A' || el.tagName === 'BUTTON' || /badge|status|pill|tag|chip/i.test(el.className);
            const isHeading = /^H[1-6]$/.test(el.tagName);
            const isHeadingWrapper = (el.tagName === 'DIV' || el.tagName === 'HEADER' || el.tagName === 'SECTION') && el.querySelector('h1, h2, h3, h4') && (el.textContent || '').trim().length < 60 && !/LEVEL|TOTAL XP|GROUP RANKING|GLOBAL RANKING/i.test(el.textContent || '');

            // 1. Corrige textos oscuros/negros y textos guinda oscuros que se pierden sobre fondos oscuros
            const colorMatch = styles.color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (colorMatch && !isBadgeOrAction && !el.closest('[class*="pet"], [id*="pet"]')) {
              const cr = parseInt(colorMatch[1], 10);
              const cg = parseInt(colorMatch[2], 10);
              const cb = parseInt(colorMatch[3], 10);

              // Texto negro / gris muy oscuro
              if (cr < 95 && cg < 95 && cb < 95) {
                saveOrigStyle(el);
                if (cr >= 55 && cg >= 55 && cb >= 55) {
                  el.dataset.mutedLight = '1';
                  el.style.setProperty('color', '#b4b4c2', 'important');
                } else {
                  el.style.setProperty('color', 'var(--text-main)', 'important');
                }
              }
              // Texto guinda / vino oscuro (ej. encabezados, nombres y XP en Statistics)
              else if (cr >= 80 && cr <= 200 && cg < 75 && cb < 85 && cr > cg + 45) {
                saveOrigStyle(el);
                const isInsideTd = el.closest('td') !== null;
                if (isInsideTd && !/\bXP\b|^\d+$/.test((el.textContent || '').trim())) {
                  el.dataset.burgundyPrimary = '1';
                  el.style.setProperty('color', '#fda4af', 'important');
                } else {
                  el.dataset.burgundyText = '1';
                  el.style.setProperty('color', '#ff7b8d', 'important');
                }
              }
            }

            // 2. Corrige fondos claros y globo de Beenary
            if (petYellowBgs.includes(bg)) {
              saveOrigStyle(el);
              el.style.setProperty('background-color', '#22201b', 'important');
              el.style.setProperty('border-color', 'rgba(243, 198, 79, 0.45)', 'important');
              el.style.setProperty('color', '#f1f1f4', 'important');
            } else if (isLightColor(bg)) {
              saveOrigStyle(el);
              if (isModalSurface) {
                el.style.setProperty('background', '#18181f', 'important');
                el.style.setProperty('background-color', 'var(--bg-card, #18181f)', 'important');
                el.style.setProperty('color', 'var(--text-main, #f1f1f4)', 'important');
              } else if (isHeading || isHeadingWrapper || (parentCard && !isBadgeOrAction)) {
                el.style.setProperty('background', 'transparent', 'important');
                el.style.setProperty('background-color', 'transparent', 'important');
                el.style.setProperty('box-shadow', 'none', 'important');
                el.style.setProperty('border', 'none', 'important');
              } else if (!isBadgeOrAction) {
                el.style.setProperty('background-color', 'var(--bg-card)', 'important');
                el.style.setProperty('color', 'var(--text-main)', 'important');
              } else if (el.tagName === 'A' || el.tagName === 'BUTTON') {
                el.style.setProperty('background-color', 'var(--bg-card)', 'important');
                el.style.setProperty('color', 'var(--brand-primary)', 'important');
              }
            }
          });

          // 3. Restaura los cuadros de estadísticas (Home, Competitions y Admin Panel)
          const statLabels = [
            'LEVEL', 'TOTAL XP', 'GROUP RANKING', 'GLOBAL RANKING',
            'TOTAL COMPETITIONS', 'ACTIVE', 'FINISHED', 'UPCOMING',
            'ACTIVE TEACHERS', 'REGISTERED USERS', 'TOTAL GROUPS', 'TOTAL STUDENTS'
          ];
          document.querySelectorAll('main div, main section, main article').forEach(card => {
            if (card.closest('.navbar, header.navbar, .creator-card, [class*="pet"], [id*="pet"]') || isInsideMiniGame(card) || isInsideBossBattle(card)) return;
            const rawTxt = card.innerText ? card.innerText.trim().toUpperCase() : '';
            const cleanTxt = rawTxt.replace(/:/g, '');
            let matched = statLabels.filter(lbl => cleanTxt.startsWith(lbl + '\n') || cleanTxt === lbl || (cleanTxt.includes(lbl) && cleanTxt.length < 35));
            if (matched.includes('ACTIVE TEACHERS')) {
              matched = matched.filter(lbl => lbl !== 'ACTIVE');
            }

            if (
              matched.length === 1 &&
              card.children.length >= 2 &&
              card.offsetWidth >= 140 &&
              card.offsetWidth < window.innerWidth * 0.65 &&
              card.offsetHeight >= 75 &&
              card.offsetHeight <= 240
            ) {
              saveOrigStyle(card);
              card.dataset.homeStat = '1';
              card.style.setProperty('background-color', 'var(--bg-card, #18181f)', 'important');
              card.style.setProperty('border', '1.5px solid var(--border-subtle, #2c2c38)', 'important');
              card.style.setProperty('border-radius', '18px', 'important');
              card.style.setProperty('box-shadow', '0 8px 24px rgba(0, 0, 0, 0.35)', 'important');

              // Quita los trazos/bordes internos alrededor de los textos y números
              card.querySelectorAll('div, p, span').forEach(inner => {
                saveOrigStyle(inner);
                inner.style.setProperty('background', 'transparent', 'important');
                inner.style.setProperty('background-color', 'transparent', 'important');
                inner.style.setProperty('border', 'none', 'important');
                inner.style.setProperty('box-shadow', 'none', 'important');
              });
            }
          });

          // 3b. Elementos visuales del Dashboard de Admin (/admin-panel/)
          document.querySelectorAll('main section, main div').forEach(panel => {
            if (panel.closest('.navbar, header.navbar')) return;
            const heading = panel.querySelector('h2, h3, h4');
            if (!heading) return;
            const title = (heading.textContent || '').trim();

            // A) Users Overview: gráfico circular y puntos de leyenda
            if (title === 'Users Overview' && panel.offsetWidth < window.innerWidth * 0.65) {
              let studentsPct = 68;
              panel.querySelectorAll('span, div, p').forEach(el => {
                const t = (el.textContent || '').trim();
                const m = t.match(/^(\d+)%$/);
                if (m && parseInt(m[1], 10) > 50) studentsPct = parseInt(m[1], 10);

                // Círculo del gráfico (conic-gradient)
                if (el.offsetWidth >= 110 && el.offsetWidth <= 240 && Math.abs(el.offsetWidth - el.offsetHeight) <= 8 && (t.includes('%') || el.children.length <= 2)) {
                  saveOrigStyle(el);
                  el.dataset.adminPie = '1';
                  el.style.setProperty('--students-pct', `${studentsPct}%`);
                  el.style.setProperty('background-image', `conic-gradient(#9e2235 0% ${studentsPct}%, #e56b7c ${studentsPct}% 100%)`, 'important');
                  el.style.setProperty('border-radius', '50%', 'important');
                }

                // Cuadritos de leyenda (Students / Teachers)
                if (el.children.length === 0 && t === '' && el.offsetWidth >= 8 && el.offsetWidth <= 22 && el.offsetHeight >= 8 && el.offsetHeight <= 22) {
                  const parentTxt = (el.parentElement?.textContent || '').trim();
                  if (/Students/i.test(parentTxt)) {
                    saveOrigStyle(el);
                    el.dataset.adminLegend = 'students';
                    el.style.setProperty('background-color', '#9e2235', 'important');
                  } else if (/Teachers/i.test(parentTxt)) {
                    saveOrigStyle(el);
                    el.dataset.adminLegend = 'teachers';
                    el.style.setProperty('background-color', '#e56b7c', 'important');
                  }
                }
              });
            }

            // B) Students by Level: cuadros A1 - C2
            if (title === 'Students by Level' && panel.offsetWidth < window.innerWidth * 0.65) {
              panel.querySelectorAll('div').forEach(box => {
                const t = (box.textContent || '').trim();
                if (/^(A1|A2|B1|B2|C1|C2)\s*\d+$/.test(t) && box.offsetWidth >= 45 && box.offsetWidth <= 130 && box.offsetHeight >= 45 && box.offsetHeight <= 110) {
                  saveOrigStyle(box);
                  box.dataset.adminLevelBox = '1';
                  box.style.setProperty('background-color', '#20202a', 'important');
                  box.style.setProperty('border', '1.5px solid rgba(224, 90, 109, 0.55)', 'important');
                  box.style.setProperty('border-radius', '12px', 'important');
                }
              });
            }

            // D) Most Challenging Words: filas suaves y porcentajes destacados
            if (title === 'Most Challenging Words' && panel.offsetWidth < window.innerWidth * 0.5) {
              panel.querySelectorAll('div, li').forEach(row => {
                const t = (row.textContent || '').trim();
                if (/^[a-zA-Z\s-]+\s+\d+%$/.test(t) && row.offsetHeight >= 28 && row.offsetHeight <= 60 && row.offsetWidth >= 150) {
                  saveOrigStyle(row);
                  row.dataset.adminWordRow = '1';
                  row.style.setProperty('background-color', '#20202a', 'important');
                  row.style.setProperty('border', '1px solid #2c2c38', 'important');
                  row.style.setProperty('border-radius', '10px', 'important');
                }
              });
            }
          });

          // 3c. Tarjeta "Student Performance" en /admin-panel/ (barras de grupo y AVERAGE SCORE)
          document.querySelectorAll('main h1, main h2, main h3, main h4, main div, main span, main p').forEach(el => {
            if ((el.textContent || '').trim() !== 'Student Performance') return;
            let card = el.parentElement;
            while (card && card !== document.body && card.tagName !== 'MAIN') {
              const txt = card.textContent || '';
              if (/Average score by group/i.test(txt) && /AVERAGE SCORE:/i.test(txt) && !/Users Overview/i.test(txt)) {
                break;
              }
              card = card.parentElement;
            }
            if (!card || card === document.body || card.tagName === 'MAIN') return;

            // 1. Recuadro inferior "AVERAGE SCORE: 87%"
            card.querySelectorAll('div, p, span').forEach(box => {
              const bt = (box.textContent || '').trim();
              if (box !== card && /^AVERAGE SCORE:\s*\d+%$/i.test(bt) && !/Grupo/i.test(bt) && box.offsetHeight >= 24 && box.offsetHeight <= 100) {
                saveOrigStyle(box);
                box.dataset.adminAvgPill = '1';
                box.style.setProperty('background', 'rgba(224, 90, 109, 0.14)', 'important');
                box.style.setProperty('background-color', 'rgba(224, 90, 109, 0.14)', 'important');
                box.style.setProperty('border', '1px solid rgba(224, 90, 109, 0.35)', 'important');
                box.style.setProperty('border-radius', '12px', 'important');
                box.style.setProperty('color', '#fda4af', 'important');

                box.querySelectorAll('span, p, strong, b').forEach(txtEl => {
                  saveOrigStyle(txtEl);
                  const isPct = /^\d+%$/.test((txtEl.textContent || '').trim());
                  txtEl.style.setProperty('color', isPct ? '#ffffff' : '#fda4af', 'important');
                });
              }
            });

            // 2. Barras de progreso de cada grupo
            card.querySelectorAll('div, span').forEach(track => {
              if (track === card || (track.textContent || '').trim() !== '') return;
              if (track.children.length === 1 && track.offsetWidth >= 40 && track.offsetHeight >= 4 && track.offsetHeight <= 24) {
                const fill = track.firstElementChild;
                saveOrigStyle(track);
                track.dataset.adminBarTrack = '1';
                track.style.setProperty('background', '#282834', 'important');
                track.style.setProperty('background-color', '#282834', 'important');
                track.style.setProperty('border', 'none', 'important');
                track.style.setProperty('border-radius', '999px', 'important');
                track.style.setProperty('overflow', 'hidden', 'important');

                saveOrigStyle(fill);
                fill.dataset.adminBarFill = '1';
                fill.style.setProperty('display', 'block', 'important');
                fill.style.setProperty('height', '100%', 'important');

              if (/danger|error|fail|invalid/.test(cls) || /\b(error|failed|invalid|cannot|denied)\b/.test(txt)) return 'error';
              if (/warning|warn/.test(cls) || /\b(warning|caution|attention)\b/.test(txt)) return 'warning';
              if (/info|notice/.test(cls)) return 'info';
              if (/success/.test(cls) || /\b(successfully|added|updated|deleted|created|restored|saved|uploaded)\b/.test(txt)) return 'success';

              if (m) {
                const [r, g, b] = [Number(m[1]), Number(m[2]), Number(m[3])];
                if (g > 200 && g > r + 15 && g > b + 15) return 'success'; // Verde pastel (#dcfce7 / #d4edda)
                if (r > 210 && r > g + 25 && r > b + 25) return 'error';   // Rojo pastel (#fee2e2 / #f8d7da)
                if (r > 215 && g > 200 && b < 190) return 'warning';       // Amarillo pastel (#fef3c7 / #fff3cd)
                if (b > 210 && b > r + 20) return 'info';                  // Azul pastel (#dbeafe / #d1ecf1)
              }
              return null;
            };

            const palettes = {
              success: { bg: 'rgba(16, 185, 129, 0.13)', border: 'rgba(52, 211, 153, 0.38)', text: '#4ade80' },
              error:   { bg: 'rgba(239, 68, 68, 0.14)',  border: 'rgba(248, 113, 113, 0.38)', text: '#f87171' },
              warning: { bg: 'rgba(245, 158, 11, 0.14)', border: 'rgba(251, 191, 36, 0.38)', text: '#fbbf24' },

              el.style.setProperty('background', p.bg, 'important');

                child.style.setProperty('background', 'transparent', 'important');

            const scanAllAlerts = () => {

                const bg = getComputedStyle(el).backgroundColor || '';

            const st = getComputedStyle(overlay);
            if (st.display === 'none' || st.visibility === 'hidden') return;

            const isFixedOverlay = st.position === 'fixed' && overlay.offsetWidth >= window.innerWidth * 0.85 && overlay.offsetHeight >= window.innerHeight * 0.85;

                modalCard.style.setProperty('border', '1.5px solid var(--border-subtle, #2c2c38)', 'important');
                modalCard.style.setProperty('border-radius', '24px', 'important');

                  avatarWrap.style.setProperty('border-radius', '50%', 'important');

                const btns = modalCard.querySelectorAll('button');
                if (btns.length >= 2) {
                  saveOrigStyle(btns[0]);
                  btns[0].style.setProperty('background', 'transparent', 'important');
                  btns[0].style.setProperty('background-color', 'transparent', 'important');
                  btns[0].style.setProperty('border', '1.5px solid rgba(255, 255, 255, 0.75)', 'important');
                  btns[0].style.setProperty('border-radius', '999px', 'important');
                  btns[0].style.setProperty('color', '#ffffff', 'important');

                  saveOrigStyle(btns[1]);
                  btns[1].style.setProperty('background', '#7a1f2b', 'important');
                  btns[1].style.setProperty('background-color', '#7a1f2b', 'important');
                  btns[1].style.setProperty('border', '1.5px solid #7a1f2b', 'important');
                  btns[1].style.setProperty('border-radius', '999px', 'important');

                return;
              }

              saveOrigStyle(modalCard);
              modalCard.dataset.genericModal = '1';
              if (modalTxt.includes('MISSING LETTERS') || modalTxt.includes('HANGMAN') || modalTxt.includes('WORD SEARCH')) {
                modalCard.dataset.minigameModal = '1';
              }
              modalCard.style.setProperty('background', '#18181f', 'important');
              modalCard.style.setProperty('background-color', 'var(--bg-card, #18181f)', 'important');
              modalCard.style.setProperty('border', '1.5px solid var(--border-subtle, #2c2c38)', 'important');
              modalCard.style.setProperty('border-radius', '22px', 'important');
              modalCard.style.setProperty('box-shadow', '0 24px 60px rgba(0, 0, 0, 0.85)', 'important');
              modalCard.style.setProperty('color', 'var(--text-main, #f1f1f4)', 'important');

              // Destapa la imagen en el modal "Crop Profile Picture" (PNG, JPG, JPEG, WebP)
              if (modalTxt.includes('Crop Profile Picture')) {
                modalCard.dataset.cropModal = '1';

                const cleanCropperLayers = () => {
                  modalCard.querySelectorAll('img, canvas').forEach(media => {
                    saveOrigStyle(media);
                    media.style.setProperty('filter', 'none', 'important');
                    media.style.setProperty('-webkit-filter', 'none', 'important');
                    media.style.setProperty('mix-blend-mode', 'normal', 'important');
                    media.style.setProperty('opacity', '1', 'important');
                    media.style.setProperty('background', 'transparent', 'important');
                    media.style.setProperty('background-color', 'transparent', 'important');
                  });

                  const cropCandidates = Array.from(modalCard.querySelectorAll('div')).filter(box =>
                    box !== modalCard &&
                    !box.querySelector('button') &&
                    !(box.textContent || '').includes('Crop Profile Picture') &&

                    box.offsetHeight >= 120
                  );

                  if (cropCandidates.length > 0) {
                    const mainCropBox = cropCandidates[0];

                    mainCropBox.querySelectorAll('div, span').forEach(inner => {
                      saveOrigStyle(inner);
                      if (inner.classList.contains('cropper-modal')) {
                        inner.style.setProperty('background-color', 'rgba(0, 0, 0, 0.65)', 'important');
                        inner.style.setProperty('opacity', '1', 'important');
                      } else if (inner.classList.contains('cropper-line') || inner.classList.contains('cropper-point')) {

                      } else {

                cleanCropperLayers();

              if (modalTxt.includes('Add a Word List')) {
                modalCard.querySelectorAll('label, div').forEach(opt => {

                  const optTxt = opt.textContent || '';
                  if (hasRadioOrCheck && /words/i.test(optTxt) && opt.offsetHeight >= 45 && opt.offsetHeight <= 130) {
                    saveOrigStyle(opt);
                    opt.dataset.wordlistOption = '1';
                    opt.style.setProperty('background-color', '#20202a', 'important');
                    opt.style.setProperty('border', '1.5px solid #3a3a48', 'important');

              modalCard.querySelectorAll('button, span[role="button"], a').forEach(cBtn => {

                const cTxt = (cBtn.textContent || '').trim();

                const isSmallSquare = rect.width >= 20 && rect.width <= 52 && Math.abs(rect.width - rect.height) <= 6;
                const hasCloseHint = /close|cerrar|dismiss|modal-close/i.test((cBtn.className || '') + ' ' + (cBtn.id || '') + ' ' + (cBtn.getAttribute('aria-label') || ''));
                const isCloseIcon = cBtn.classList.contains('btn-close') ||
                                    cTxt === '×' || cTxt === '✕' || cTxt === 'X' || cTxt === 'x' ||
                                    (cTxt === '' && (cBtn.querySelector('svg, i') !== null || hasCloseHint || isSmallSquare));

                if (isCloseIcon && (rect.width === 0 || rect.width <= 54)) {

                    cBtn.style.setProperty('filter', 'invert(1) grayscale(100%) brightness(220%)', 'important');

                  } else {

                    cBtn.style.setProperty('color', '#ffffff', 'important');
                    cBtn.style.setProperty('border-color', 'rgba(255, 255, 255, 0.28)', 'important');
                    cBtn.style.setProperty('opacity', '1', 'important');
                  }

              });

              if (!modalCard.dataset.minigameModal) {

                  if (sub === modalCard) return;
                  const sSt = getComputedStyle(sub);
                  const hasBorder = sSt.borderWidth !== '0px' && sSt.borderStyle !== 'none';
                  const isMetricBox = hasBorder && sub.offsetHeight >= 45 && sub.offsetHeight <= 150 && sub.offsetWidth >= 100 && sub.offsetWidth < modalCard.offsetWidth * 0.92;
                  if (isMetricBox) {
                    saveOrigStyle(sub);
                    sub.dataset.modalSubcard = '1';
                    sub.style.setProperty('background-color', 'var(--bg-subtle, #20202a)', 'important');
                    sub.style.setProperty('border', '1px solid var(--border-subtle, #2c2c38)', 'important');
                    sub.style.setProperty('border-radius', '14px', 'important');
                  }

            }
          });

          // 12. Botones "View Competition" de Progress
          document.querySelectorAll('main button, main a').forEach(b => {

              b.dataset.viewCompBtn = '1';
              b.style.setProperty('background-color', '#272734', 'important');
              b.style.setProperty('color', '#f4f4f6', 'important');
              b.style.setProperty('border', '1.5px solid rgba(224, 90, 109, 0.7)', 'important');
              b.style.setProperty('border-radius', '10px', 'important');
              b.style.setProperty('font-weight', '600', 'important');

          // 12b. Botones "VIEW" en tablas (ej. Students dentro de View Group)
          document.querySelectorAll('main table button, main table a').forEach(b => {
            if (/^view$/i.test((b.textContent || '').trim())) {
              saveOrigStyle(b);
              b.dataset.tableViewBtn = '1';
              b.style.setProperty('background', '#7a1f2b', 'important');
              b.style.setProperty('background-color', '#7a1f2b', 'important');
              b.style.setProperty('color', '#ffffff', 'important');
              b.style.setProperty('border', '1.5px solid rgba(224, 90, 109, 0.7)', 'important');
              b.style.setProperty('border-radius', '999px', 'important');
              b.style.setProperty('font-weight', '600', 'important');
            }

          // 12c. Botones "Manage Participants" y "Manage Competition" en Competitions
          document.querySelectorAll('main a, main button').forEach(b => {
            if (b.closest('[data-modal-backdrop="1"]')) return;
            if (/^(Manage Participants|Manage Competition)$/i.test((b.textContent || '').trim())) {
              saveOrigStyle(b);
              b.dataset.compManageBtn = '1';
              b.style.setProperty('background', 'rgba(224, 90, 109, 0.14)', 'important');
              b.style.setProperty('background-color', 'rgba(224, 90, 109, 0.14)', 'important');

              b.style.setProperty('border', '1.5px solid #e05a6d', 'important');
              b.style.setProperty('border-radius', '999px', 'important');
              b.style.setProperty('font-weight', '600', 'important');

            const txt = (el.textContent || '').trim();
            if (!/^(Active|Upcoming|Finished)$/i.test(txt)) return;

            const card = el.closest('div, article, section');
            if (!card || !(card.textContent || '').includes('CODE:')) return;

            const statusKey = txt.toLowerCase();
            const palette = {
              active:   { bg: '#6ee76e', fg: '#0f2912' },

              el.dataset.compStatus = statusKey;

            if (txt.includes('Students by level') && txt.includes('A1 -') && card.offsetWidth > 300) {
              const levelColors = {

                A2: '#f29b9b',
                B1: '#e46d72',

                C1: '#9e242e',

              const allLevels = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
              const activeLevels = [];

              // 1. Etiqueta cada punto circular de la leyenda (A1 - 0 ... C2 - 0) y detecta niveles activos (> 0)
              card.querySelectorAll('div, span, li').forEach(item => {
                const itemTxt = (item.textContent || '').trim();
                const match = itemTxt.match(/^(A1|A2|B1|B2|C1|C2)\s*-\s*(\d+)$/);
                if (match && item.children.length >= 1 && item.children.length <= 3) {
                  const lvl = match[1];
                  const count = parseInt(match[2], 10);
                  if (count > 0 && !activeLevels.includes(lvl)) {
                    activeLevels.push(lvl);

                  const dot = Array.from(item.querySelectorAll('span, div')).find(d => (d.textContent || '').trim() === '');
                  if (dot) {
                    saveOrigStyle(dot);
                    dot.dataset.dashDot = '1';
                    dot.dataset.cefrLevel = lvl;
                    dot.style.setProperty('background', levelColors[lvl], 'important');
                    dot.style.setProperty('background-color', levelColors[lvl], 'important');
                  }
                }
              });

              // 2. Pinta cada segmento dentro de la barra horizontal según su nivel correspondiente
              card.querySelectorAll('div, section').forEach(track => {
                if (track === card) return;
                const h = track.offsetHeight;
                const w = track.offsetWidth;
                if (h >= 6 && h <= 20 && w > 200 && track.children.length > 0) {
                  saveOrigStyle(track);
                  track.dataset.dashTrack = '1';
                  track.style.setProperty('background-color', '#262633', 'important');
                  track.style.setProperty('border-radius', '999px', 'important');
                  track.style.setProperty('overflow', 'hidden', 'important');

                  const segments = Array.from(track.children);
                  const levelSequence = segments.length === 6 ? allLevels : activeLevels;

                  segments.forEach((seg, idx) => {
                    const cls = (seg.className || '') + ' ' + (seg.getAttribute('title') || '');
                    const explicitLvl = cls.match(/\b(A1|A2|B1|B2|C1|C2)\b/i);
                    const lvl = explicitLvl ? explicitLvl[1].toUpperCase() : (levelSequence[idx] || allLevels[idx]);
                    if (lvl && levelColors[lvl]) {
                      saveOrigStyle(seg);
                      seg.dataset.dashSegment = '1';
                      seg.dataset.cefrLevel = lvl;

                const w = el.offsetWidth;

                if (h >= 6 && h <= 18 && w >= 120 && el.children.length >= 1) {
                  saveOrigStyle(el);
                  el.dataset.dashTrack = '1';
                  el.style.setProperty('background-color', '#262633', 'important');
                  el.style.setProperty('border-radius', '999px', 'important');
                  el.style.setProperty('overflow', 'hidden', 'important');

                  const fill = el.firstElementChild;
                  if (fill) {
                    saveOrigStyle(fill);
                    fill.dataset.dashFill = '1';
                    fill.style.setProperty('background', '#b8293d', 'important');
                    fill.style.setProperty('background-color', '#b8293d', 'important');
                    fill.style.setProperty('border-radius', '999px', 'important');
                  }
                } else if (h >= 6 && h <= 18 && w > 0 && parentW >= 120 && el.parentElement.dataset.dashTrack === '1') {
                  saveOrigStyle(el);
                  el.dataset.dashFill = '1';
                  el.style.setProperty('background', '#b8293d', 'important');
                  el.style.setProperty('background-color', '#b8293d', 'important');
                }
              });
            }
          });
        } finally {
          isFixing = false;
        }
      }

      const initialTheme = document.documentElement.getAttribute('data-theme') || 'light';
      syncThemeUI(initialTheme);
      fixRemainingLightSurfaces();

      new MutationObserver(() => {
        if (document.documentElement.getAttribute('data-theme') === 'dark') {
          clearTimeout(fixTimer);
          fixTimer = setTimeout(fixRemainingLightSurfaces, 30);
        }
      }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style'] });

      btn.addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        document.documentElement.setAttribute('data-bs-theme', next);
        localStorage.setItem('spell_theme', next);
        syncThemeUI(next);
        setTimeout(fixRemainingLightSurfaces, 10);
      });
    })();

          const MOON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
          const SUN_SVG  = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';

          const findThemeFab = () => {
            const direct = document.querySelector('#theme-toggle, #themeToggle, .theme-toggle, [data-theme-toggle], [data-theme-fab="1"]');
            if (direct) return direct;

            // Respaldo: localizar el botón circular fijo en la esquina inferior derecha
            return Array.from(document.querySelectorAll('button, a')).find(btn => {
              const cs = getComputedStyle(btn);
              const rect = btn.getBoundingClientRect();
              return (
                cs.position === 'fixed' &&
                rect.width >= 36 && rect.width <= 68 &&
                rect.height >= 36 && rect.height <= 68 &&
                (window.innerWidth - rect.right) <= 45 &&
                (window.innerHeight - rect.bottom) <= 45
              );
            });
          };

          const updateThemeFabIcon = () => {
            const fab = findThemeFab();
            if (!fab) return;
            fab.dataset.themeFab = '1';

            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const targetSvg = isDark ? SUN_SVG : MOON_SVG;

            // Actualizar tanto el contenedor directo como posibles spans internos del botón
            const iconHolder = fab.querySelector('span, i') && !fab.querySelector('svg')
              ? fab.querySelector('span, i')
              : fab;

            if (iconHolder.dataset.lastIconTheme !== (isDark ? 'dark' : 'light')) {
              iconHolder.innerHTML = targetSvg;
              iconHolder.dataset.lastIconTheme = isDark ? 'dark' : 'light';
            }
          };

          updateThemeFabIcon();

          // Observar cambios en el atributo data-theme del <html> para actualizar el ícono al instante
          if (!window.__themeFabObserver) {
            window.__themeFabObserver = new MutationObserver((mutations) => {
              if (mutations.some(m => m.attributeName === 'data-theme')) {
                updateThemeFabIcon();
              }
            });
            window.__themeFabObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ['data-theme']
            });
          }

          // Refuerzo inmediato al hacer clic sobre el botón
          document.addEventListener('click', (e) => {
            if (e.target.closest('#theme-toggle, #themeToggle, .theme-toggle, [data-theme-toggle], [data-theme-fab="1"]')) {
              requestAnimationFrame(updateThemeFabIcon);
              setTimeout(updateThemeFabIcon, 20);
            }
          }, true);
        })();
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
