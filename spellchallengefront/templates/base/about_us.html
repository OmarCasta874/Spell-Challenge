{% extends 'base/base.html' %}
{% load static %}
{% block title %}About Us — Spell-Challenge{% endblock %}
{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/about_us.css' %}">
{% endblock %}

{% block content %}
<div class="about-page">
  <header class="about-header">
    <a href="{% url 'landing' %}" class="about-back" aria-label="Back to home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>
    <h1 class="about-title">CREATED BY</h1>
  </header>

  <main class="creators-grid">
    <!-- Card 1: Josue -->
    <article class="creator-card">
      <div class="creator-photo-frame">
        <img src="{% static 'img/josue.png' %}" alt="Josue Alberto Villegas Hernández">
      </div>
      <h2 class="creator-name">
        <span>Josue Alberto</span>
        <span>Villegas Hernández</span>
      </h2>
    </article>

    <!-- Card 2: Omar -->
    <article class="creator-card">
      <div class="creator-photo-frame">
        <img src="{% static 'img/omar.png' %}" alt="Jesus Omar Castañón Castañón">
      </div>
      <h2 class="creator-name">
        <span>Jesus Omar</span>
        <span>Castañón Castañón</span>
      </h2>
    </article>

    <!-- Card 3: Diego -->
    <article class="creator-card">
      <div class="creator-photo-frame">
        <img src="{% static 'img/diego.png' %}" alt="Diego Sánchez Hernández">
      </div>
      <h2 class="creator-name">
        <span>Diego</span>
        <span>Sánchez Hernández</span>
      </h2>
    </article>
  </main>
</div>
{% endblock %}
