{% load static %}
<div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content cancel-modal-content">
      <div class="cancel-modal-avatar-wrapper">
        <img src="{% static avatar_img %}" alt="Avatar" class="cancel-modal-avatar">
      </div>
      <div class="modal-body cancel-modal-body">
        <h2 class="cancel-modal-title">Cancel Changes</h2>
        <p class="cancel-modal-text">Are you sure you want to cancel? All applied changes will not be saved.</p>
        <div class="cancel-modal-actions">
          <button type="button" class="btn cancel-modal-no" data-bs-dismiss="modal">NO</button>
          <a href="{% url cancel_url %}" class="btn cancel-modal-yes">YES</a>
        </div>
      </div>
    </div>
  </div>
</div>
