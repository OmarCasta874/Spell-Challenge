{% extends 'teacher/teacher_base.html' %}
{% load static %}

{% block extra_css %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'css/teacher_profile.css' %}">
{% endblock %}

{% block content %}
<div class="profile-container">
  <!-- Cabecera con Avatar y Nombre del Profesor -->
  <div class="profile-header">
    <div class="avatar-wrapper">
      <img src="{% static 'images/teacher.png' %}" alt="Avatar del profesor" class="profile-avatar">
    </div>
    <div class="user-main-info">
      <h1 class="user-fullname">{{ request.user.get_full_name|default:"JOSÉ MANUEL FLORES RUIZ" }}</h1>
      <p class="user-subtitle">35 YEARS</p>
      <p class="user-subtitle">English Teacher</p>
    </div>
  </div>

  <!-- Formulario / Configuración de Cuenta -->
  <div class="account-settings-card">
    <form method="POST" action="{% url 'teacher_profile' %}" class="profile-form">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-group">
          <label for="first_name">First Name:</label>
          <input type="text" id="first_name" name="first_name" value="{{ request.user.first_name|default:'José Manuel' }}" class="form-control">
        </div>

        <div class="form-group">
          <label for="last_name">Last Name:</label>
          <input type="text" id="last_name" name="last_name" value="{{ request.user.last_name|default:'Flores Ruiz' }}" class="form-control">
        </div>

        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" value="{{ request.user.email|default:'jose.manuel@spell-challenge.usa' }}" class="form-control">
        </div>

        <div class="form-group">
          <label for="role">Role:</label>
          <input type="text" id="role" name="role" value="Teacher" class="form-control" readonly>
        </div>
      </div>

      <h2 class="section-title">ACCOUNT SETTINGS</h2>

      <!-- Acciones de Perfil -->
      <div class="profile-actions">
        <button type="submit" class="btn btn-edit">EDIT PROFILE</button>
        <button type="button" class="btn btn-logout" data-bs-toggle="modal" data-bs-target="#logoutModal">LOG OUT</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
